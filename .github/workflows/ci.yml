name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing

  security:
    # Separate job so a failing scan never hides a passing test run.
    # Expected to be RED until you fix the High findings (Lab Part C).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit scan (fail on High severity)
        run: bandit -r src --severity-level high
